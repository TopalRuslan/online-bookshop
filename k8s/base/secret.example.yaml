# EXAMPLE ONLY — do not fill real values here and do not `kubectl apply` this file.
#
# The real Secret is created out-of-band and never committed:
#
#   kubectl -n bookshop create secret generic bookshop-secrets \
#     --from-literal=SECRET_KEY="$(python -c 'from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())')" \
#     --from-literal=DB_USER=bookshop \
#     --from-literal=DB_PASSWORD='...' \
#     --from-literal=STRIPE_SECRET_KEY='sk_test_...' \
#     --from-literal=STRIPE_WEBHOOK_SECRET='whsec_...' \
#     --from-literal=EMAIL_HOST_USER='' \
#     --from-literal=EMAIL_HOST_PASSWORD=''
#
# or:  kubectl -n bookshop create secret generic bookshop-secrets --from-env-file=.env.k8s
#
# For prod, manage it with Sealed Secrets / SOPS / External Secrets Operator
# instead of a raw file.
#
# Consumed via `envFrom: [secretRef: {name: bookshop-secrets}]` by web, celery
# and the migrate Job. The postgres StatefulSet reads DB_USER / DB_PASSWORD
# from the same Secret (as POSTGRES_USER / POSTGRES_PASSWORD).
apiVersion: v1
kind: Secret
metadata:
  name: bookshop-secrets
type: Opaque
stringData:
  # --- Django ---
  SECRET_KEY: "REPLACE_ME-generate-with-get_random_secret_key"

  # --- Database credentials (also feed the postgres StatefulSet) ---
  DB_USER: "bookshop"
  DB_PASSWORD: "REPLACE_ME"

  # --- Stripe (secret + webhook signing key; publishable key is in the ConfigMap) ---
  STRIPE_SECRET_KEY: "sk_test_REPLACE_ME"
  STRIPE_WEBHOOK_SECRET: "whsec_REPLACE_ME"

  # --- SMTP credentials. Leave empty to keep the console email backend. ---
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""

  # --- AWS keys: OMIT these entirely when the cluster uses an instance role /
  #     IRSA for S3 access (EC2 / EKS). Only needed for static credentials. ---
  # AWS_ACCESS_KEY_ID: ""
  # AWS_SECRET_ACCESS_KEY: ""
